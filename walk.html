<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Marine Commander · Walk the Decks</title>
<style>
  :root { --fg:#d7e3f4; --dim:#8da0b8; --acc:#ffb347; --bg:rgba(8,12,20,.78); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#05070a; color:var(--fg);
    font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .panel { position:fixed; background:var(--bg); border:1px solid #243247; border-radius:8px;
    padding:8px 10px; backdrop-filter: blur(4px); }
  #hud { z-index:6; top:10px; left:10px; display:flex; gap:8px; align-items:center; }
  #hud select { background:#0d1626; color:var(--fg); border:1px solid #2b3d58; border-radius:5px; padding:4px 6px; font:inherit; }
  #hud .title { font-weight:600; letter-spacing:.04em; color:var(--acc); }
  #minimap { right:10px; top:10px; padding:0; width:200px; height:200px; overflow:hidden; border-radius:50%; }
  #minimap canvas { width:100%; height:100%; display:block; }
  #prompt { left:50%; bottom:12%; transform:translateX(-50%); font-size:16px; display:none; border-color:var(--acc); }
  #prompt kbd, #overlay kbd { background:#1a2840; border:1px solid #3a5073; border-bottom-width:2px; border-radius:4px;
    padding:0 6px; font:12px ui-monospace, monospace; color:#fff; }
  #crosshair { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%;
    background:rgba(255,255,255,.55); pointer-events:none; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(5,8,14,.72), rgba(5,8,14,.94)); cursor:pointer; z-index:5; }
  #overlay .card { max-width:460px; text-align:center; padding:24px 28px; background:var(--bg); border:1px solid #243247; border-radius:12px; }
  #overlay h1 { margin:0 0 4px; font-size:22px; color:var(--acc); letter-spacing:.05em; }
  #overlay p { color:var(--dim); margin:6px 0; }
  #overlay table { margin:12px auto; text-align:left; border-spacing:10px 4px; }
  #overlay .go { margin-top:14px; font-size:16px; color:#fff; }
  #status { color:var(--dim); }
  #bigmap { position:fixed; inset:5vh 5vw; display:none; z-index:4; padding:0; }
  #bigmap canvas { width:100%; height:100%; display:block; cursor:crosshair; }
  #bigmap .hint { position:absolute; left:10px; bottom:8px; color:var(--dim); font-size:12px; pointer-events:none; }
  #fatal { color:#ff8080; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>

<div id="hud" class="panel">
  <span class="title">WALK THE DECKS</span>
  <select id="mapSelect" aria-label="Deck"></select>
  <span id="status"></span>
</div>
<div id="minimap" class="panel"><canvas id="mini" width="200" height="200"></canvas></div>
<div id="prompt" class="panel"></div>
<div id="bigmap" class="panel"><canvas id="big"></canvas>
  <div class="hint">Click to teleport · <b>M</b> or <b>Esc</b> to close</div></div>

<div id="overlay">
  <div class="card">
    <h1>MARINE COMMANDER</h1>
    <p id="overlayMsg">Loading deck…</p>
    <table>
      <tr><td><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td><td>Walk</td></tr>
      <tr><td>Mouse</td><td>Look around</td></tr>
      <tr><td><kbd>Shift</kbd></td><td>Run</td></tr>
      <tr><td><kbd>E</kbd></td><td>Use lift / ladder</td></tr>
      <tr><td><kbd>F</kbd></td><td>Flashlight</td></tr>
      <tr><td><kbd>M</kbd></td><td>Deck map &amp; teleport</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Release mouse</td></tr>
    </table>
    <p>Doors slide open when you walk up to them.</p>
    <div class="go" id="go">Click to start</div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="js/walk.js"></script>
</body>
</html>
